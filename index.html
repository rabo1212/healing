
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회복도복</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #000;
      color: #fff;
    }
    h1, h2, h3, .font-unbounded {
      font-family: 'Unbounded', cursive;
    }
    .kitsch-border {
      border: 3px solid #fff;
      box-shadow: 6px 6px 0px #ff007f;
    }
    .kitsch-button {
      background-color: #ff007f;
      color: #fff;
      border: 2px solid #fff;
      box-shadow: 4px 4px 0px #fff;
      transition: all 0.1s ease;
    }
    .kitsch-button:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px #fff;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 8px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #000;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #ff007f;
      border-radius: 10px;
    }
    .text-shadow {
      text-shadow: 2px 2px 0px #000;
    }
  </style>
